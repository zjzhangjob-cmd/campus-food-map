<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我来选择 · 觅食</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<!-- 高德地图 JS API · 由前端在运行时从 /api/config 动态加载，无需手动配置 Key -->
<script>
  window.__AMAP_JS_KEY__ = "";
  (function () {
    try {
      fetch("http://localhost:8000/api/config")
        .then(function (r) { return r.json(); })
        .then(function (cfg) {
          window.__AMAP_JS_KEY__ = (cfg && cfg.amap_js_key) || "";
          if (!window.__AMAP_JS_KEY__) return;
          var s = document.createElement("script");
          s.src = "https://webapi.amap.com/maps?v=2.0&key=" + encodeURIComponent(window.__AMAP_JS_KEY__);
          s.onload = function () { window.AMapReady = true; };
          document.head.appendChild(s);
        })
        .catch(function () { /* 后端不可用 */ });
    } catch (e) { /* 忽略 */ }
  })();
</script>
<style>
  :root {
    --ink:#1a1209;--paper:#fdf6e3;--warm:#f5ede0;--accent:#e85d26;
    --accent2:#f4b942;--accent3:#2d7a4f;--muted:#8a7a6a;
    --tag-bg:#f0e8d8;--card-bg:#fffdf7;--border:#e8dcc8;--shadow:rgba(26,18,9,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:'Noto Sans SC',sans-serif;min-height:100vh;overflow-x:hidden;}

  /* ── HEADER（统一三路径 Tab 风格） ── */
  header{position:sticky;top:0;z-index:100;background:rgba(253,246,227,.95);border-bottom:1.5px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;backdrop-filter:blur(12px);}
  .logo{display:flex;align-items:baseline;gap:8px;}
  .logo-main{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:900;color:var(--ink);text-decoration:none;}
  .logo-dot{width:7px;height:7px;background:var(--accent);border-radius:50%;display:inline-block;margin-bottom:2px;}
  .nav-tabs{display:flex;gap:4px;}
  .nav-tab{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;color:var(--muted);border:none;background:transparent;font-family:'Noto Sans SC',sans-serif;transition:all .2s;}
  .nav-tab.active,.nav-tab:hover{background:var(--ink);color:var(--paper);}
  .header-right{display:flex;align-items:center;gap:10px;}
  .hbtn{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card-bg);font-size:12px;font-family:'Noto Sans SC',sans-serif;cursor:pointer;color:var(--ink);transition:all .2s;}
  .hbtn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  #userArea{font-size:12px;color:var(--muted);}

  /* ── HERO ── */
  .hero{padding:40px 24px 24px;max-width:1200px;margin:0 auto;}
  .hero-title{font-family:'Noto Serif SC',serif;font-size:clamp(26px,4vw,40px);font-weight:900;line-height:1.2;letter-spacing:-1px;}
  .hero-subtitle{font-size:13px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:6px;}
  .search-wrap{margin-top:22px;display:flex;gap:10px;}
  .search-bar{flex:1;display:flex;align-items:center;gap:10px;background:white;border:1.5px solid var(--border);border-radius:14px;padding:0 18px;height:52px;box-shadow:0 2px 12px var(--shadow);transition:border-color .2s,box-shadow .2s;}
  .search-bar:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(232,93,38,.08);}
  .search-bar input{flex:1;border:none;outline:none;font-size:15px;background:transparent;font-family:'Noto Sans SC',sans-serif;color:var(--ink);}
  .search-bar input::placeholder{color:var(--muted);}
  .btn-primary{padding:0 24px;height:52px;background:var(--accent);color:white;border:none;border-radius:14px;font-size:15px;font-family:'Noto Sans SC',sans-serif;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(232,93,38,.3);}
  .btn-primary:hover{background:#d14e1a;transform:translateY(-1px);}
  .mood-bar{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .mood-label{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;}
  .mood-tag{padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;color:var(--ink);transition:all .18s;font-family:'Noto Sans SC',sans-serif;}
  .mood-tag:hover,.mood-tag.active{background:var(--ink);color:var(--paper);border-color:var(--ink);transform:translateY(-2px);}
  .mood-tag.special{background:linear-gradient(135deg,#e85d26,#f4b942);color:white;border:none;}
  .stats-row{margin-top:22px;display:flex;gap:32px;padding-top:20px;border-top:1px solid var(--border);}
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat-num{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:900;}
  .stat-label{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}

  /* ── MAIN ── */
  .main{max-width:1200px;margin:0 auto;padding:0 24px 80px;}
  .deals-section{margin:0 0 24px;padding:24px;background:linear-gradient(135deg,#fff8ee,#fff3e0);border:1.5px solid var(--accent2);border-radius:18px;}
  .deals-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .box-title{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .deals-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;}
  .deals-scroll::-webkit-scrollbar{height:4px;}
  .deals-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  .deal-card{flex-shrink:0;width:180px;background:white;border-radius:12px;padding:14px;border:1.5px solid rgba(244,185,66,.3);cursor:pointer;transition:all .2s;}
  .deal-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(244,185,66,.2);}
  .deal-emoji{font-size:28px;margin-bottom:8px;}
  .deal-name{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px;}
  .deal-desc{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.4;}
  .deal-price{display:flex;align-items:center;gap:6px;}
  .deal-new{font-size:15px;font-weight:700;color:var(--accent);font-family:'DM Mono',monospace;}

  /* Campus selector */
  .campus-selector{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .campus-btn{padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-family:'Noto Sans SC',sans-serif;cursor:pointer;color:var(--muted);transition:all .2s;}
  .campus-btn.active,.campus-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  /* Filters */
  .filter-section{margin-bottom:20px;}
  .filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .filter-label{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;white-space:nowrap;min-width:50px;}
  .filter-chip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card-bg);font-size:13px;cursor:pointer;color:var(--ink);transition:all .15s;font-family:'Noto Sans SC',sans-serif;display:flex;align-items:center;gap:5px;}
  .filter-chip:hover{border-color:var(--accent);color:var(--accent);}
  .filter-chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .result-count{font-size:13px;color:var(--muted);font-family:'DM Mono',monospace;}
  .result-count strong{color:var(--ink);}
  .sort-select{border:1.5px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;background:var(--card-bg);color:var(--ink);font-family:'Noto Sans SC',sans-serif;cursor:pointer;outline:none;}

  /* Cards */
  .restaurant-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .card{background:var(--card-bg);border:1.5px solid var(--border);border-radius:18px;overflow:hidden;cursor:pointer;transition:all .25s;animation:fadeUp .4s ease both;}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 32px var(--shadow);border-color:var(--accent);}
  .card-thumb{height:140px;position:relative;overflow:hidden;}
  .card-thumb-bg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:68px;transition:transform .4s;position:relative;}
  .card:hover .card-thumb-bg{transform:scale(1.06);}
  .card-thumb-bg .deco{position:absolute;border-radius:50%;opacity:.2;}
  .card-thumb-bg .deco1{width:100px;height:100px;top:-25px;right:-25px;}
  .card-thumb-bg .deco2{width:70px;height:70px;bottom:-15px;left:-10px;}
  .card-thumb-emoji{position:relative;z-index:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15));}
  .card.featured .card-thumb-emoji{font-size:84px;}
  .card-thumb-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(26,18,9,.3));}
  .card-badge{position:absolute;top:10px;left:10px;padding:3px 9px;border-radius:12px;font-size:10px;font-family:'DM Mono',monospace;letter-spacing:.5px;}
  .badge-hot{background:var(--accent);color:white;}
  .badge-new{background:var(--accent3);color:white;}
  .card-fav{position:absolute;top:10px;right:10px;width:30px;height:30px;background:rgba(255,255,255,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:transform .2s;border:none;}
  .card-fav:hover{transform:scale(1.2);}
  .card-fav.liked{background:#fee;}
  .card-body{padding:14px 16px 16px;}
  .card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .card-name{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:700;line-height:1.3;}
  .card-rating{display:flex;align-items:center;gap:3px;font-size:13px;color:var(--accent);white-space:nowrap;font-weight:600;}
  .card-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);margin-bottom:10px;font-family:'DM Mono',monospace;}
  .card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
  .card-tag{padding:2px 9px;border-radius:12px;background:var(--tag-bg);font-size:11px;color:var(--muted);}
  .card-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:10px;}
  .price-range{font-size:13px;color:var(--accent3);font-weight:600;font-family:'DM Mono',monospace;}
  .card-distance{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
  .card.featured{grid-column:span 2;display:grid;grid-template-columns:220px 1fr;}
  .card.featured .card-thumb{height:auto;min-height:180px;}
  .card.featured .card-name{font-size:20px;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  /* Loading / Empty */
  .loading{display:flex;align-items:center;justify-content:center;padding:48px;color:var(--muted);font-family:'DM Mono',monospace;font-size:14px;}
  .empty-state{padding:80px 20px;text-align:center;}
  .empty-state .empty-emoji{font-size:64px;margin-bottom:16px;opacity:.7;}
  .empty-state .empty-title{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;margin-bottom:8px;}
  .empty-state .empty-desc{font-size:13px;color:var(--muted);font-family:'DM Mono',monospace;}

  /* Pagination */
  .pagination{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:32px;}
  .page-btn{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--border);background:var(--card-bg);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;font-family:'DM Mono',monospace;color:var(--ink);transition:all .15s;}
  .page-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .page-btn:hover:not(.active){border-color:var(--accent);color:var(--accent);}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(26,18,9,.6);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;}
  .modal-overlay.open{opacity:1;pointer-events:all;}
  .modal{background:var(--paper);border-radius:24px 24px 0 0;width:100%;max-width:680px;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .4s cubic-bezier(.16,1,.3,1);}
  .modal-overlay.open .modal{transform:translateY(0);}
  .modal-hero{height:220px;display:flex;align-items:center;justify-content:center;font-size:80px;position:relative;}
  .modal-close{position:absolute;top:16px;right:16px;width:36px;height:36px;background:rgba(255,255,255,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;border:none;}
  .modal-body{padding:24px;}
  .modal-name{font-family:'Noto Serif SC',serif;font-size:26px;font-weight:900;margin-bottom:8px;}
  .modal-meta{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .modal-rating{font-size:15px;color:var(--accent);font-weight:700;}
  .modal-section{margin-bottom:20px;}
  .modal-section-title{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:1px;margin-bottom:8px;text-transform:uppercase;}
  .modal-desc{font-size:14px;line-height:1.7;}
  .menu-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--tag-bg);border-radius:10px;margin-bottom:8px;}
  .menu-item-left{display:flex;align-items:center;gap:10px;}
  .menu-item-price{font-family:'DM Mono',monospace;font-size:14px;color:var(--accent);font-weight:600;}
  .modal-actions{display:flex;gap:10px;margin-top:24px;}
  .modal-btn{flex:1;padding:14px;border-radius:12px;border:1.5px solid var(--border);background:var(--card-bg);font-size:14px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all .2s;}
  .modal-btn.primary{background:var(--accent);color:white;border-color:var(--accent);box-shadow:0 4px 16px rgba(232,93,38,.3);}
  .modal-btn:hover{transform:translateY(-1px);}
  .star-rate{display:flex;gap:8px;margin-bottom:12px;}
  .star{font-size:28px;cursor:pointer;transition:transform .1s;color:#ddd;}
  .star.on{color:var(--accent2);}
  .star:hover{transform:scale(1.2);}
  .review-input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;font-family:'Noto Sans SC',sans-serif;background:var(--paper);resize:vertical;height:80px;outline:none;}
  .review-input:focus{border-color:var(--accent);}

  /* Responsive */
  @media (max-width: 820px) {
    .restaurant-grid{grid-template-columns:1fr;}
    .card.featured{grid-column:span 1;grid-template-columns:1fr;}
    .card.featured .card-thumb{height:140px;}
    .nav-tabs .nav-tab{padding:6px 10px;font-size:11px;}
    .logo-main{font-size:16px;}
  }
</style>
</head>
<body>

<!-- HEADER · 三路径 Tab -->
<header>
  <div style="display:flex;align-items:center;gap:16px">
    <a href="index.html" style="text-decoration:none">
      <div class="logo"><span class="logo-main">觅食</span><span class="logo-dot"></span></div>
    </a>
    <div class="nav-tabs">
      <div class="nav-tab" onclick="location.href='index.html'">🔥 觅食帮选</div>
      <div class="nav-tab active">我来选择</div>
      <div class="nav-tab" onclick="location.href='circle.html'">周围人在吃什么</div>
    </div>
  </div>
  <div class="header-right">
    <div id="userArea"></div>
    <button class="hbtn" onclick="window.location.href='login.html'" id="loginBtn">登录</button>
    <button class="hbtn" onclick="Auth.logout()" id="logoutBtn" style="display:none">退出</button>
  </div>
</header>

<!-- HERO · 搜索 + 心情标签 + 数据概览 -->
<div class="hero">
  <div class="hero-title">自己挑，挑到满意为止 ✨</div>
  <div class="hero-subtitle">· 按菜系 · 人均 · 场景筛选，所有餐厅一览无余</div>

  <div class="search-wrap">
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="搜索餐厅、菜系、菜名…">
    </div>
    <button class="btn-primary" onclick="doSearch()">搜索</button>
  </div>

  <div class="mood-bar">
    <span class="mood-label">快速筛选：</span>
    <span class="mood-tag" onclick="moodFilter('辣')">🌶️ 辣的</span>
    <span class="mood-tag" onclick="moodFilter('快')">⚡ 快一点</span>
    <span class="mood-tag" onclick="moodFilter('性价比')">💰 性价比</span>
    <span class="mood-tag" onclick="moodFilter('宵夜')">🌙 宵夜</span>
    <span class="mood-tag" onclick="moodFilter('健康')">🥗 健康轻食</span>
    <span class="mood-tag" onclick="moodFilter('约饭')">👫 适合约饭</span>
  </div>

  <div class="stats-row">
    <div class="stat"><span class="stat-num" id="totalStat">—<span>家</span></span><span class="stat-label">收录餐厅</span></div>
    <div class="stat"><span class="stat-num">98<span>%</span></span><span class="stat-label">满意度</span></div>
    <div class="stat"><span class="stat-num">24<span>h</span></span><span class="stat-label">快速响应</span></div>
  </div>
</div>

<!-- MAIN · 校园选择 + 筛选 + 卡片瀑布流 -->
<div class="main">

  <div class="deals-section" id="dealsSection" style="display:none">
    <div class="deals-header">
      <span class="box-title">🎟️ 学生专属优惠</span>
    </div>
    <div class="deals-scroll" id="dealsScroll"></div>
  </div>

  <div class="campus-selector" id="campusBtns">
    <button class="campus-btn active" data-campus="">全部校区</button>
    <button class="campus-btn" data-campus="理工大">理工大</button>
    <button class="campus-btn" data-campus="师范大">师范大</button>
    <button class="campus-btn" data-campus="医科大">医科大</button>
    <button class="campus-btn" data-campus="财经大">财经大</button>
  </div>

  <div class="filter-section">
    <div class="filter-row">
      <span class="filter-label">菜系</span>
      <div class="filter-chip active" onclick="setFilter(this,'cuisine','')" data-val="">🍽️ 全部</div>
      <div class="filter-chip" onclick="setFilter(this,'cuisine','中餐')" data-val="中餐">🥢 中餐</div>
      <div class="filter-chip" onclick="setFilter(this,'cuisine','日料')" data-val="日料">🍣 日料</div>
      <div class="filter-chip" onclick="setFilter(this,'cuisine','韩餐')" data-val="韩餐">🥘 韩餐</div>
      <div class="filter-chip" onclick="setFilter(this,'cuisine','西餐')" data-val="西餐">🥩 西餐</div>
      <div class="filter-chip" onclick="setFilter(this,'cuisine','快餐')" data-val="快餐">🍟 快餐</div>
      <div class="filter-chip" onclick="setFilter(this,'cuisine','小吃')" data-val="小吃">🧆 小吃</div>
    </div>
    <div class="filter-row">
      <span class="filter-label">人均</span>
      <div class="filter-chip active" onclick="setFilter(this,'price_max','')" data-val="">不限</div>
      <div class="filter-chip" onclick="setFilter(this,'price_max','10')" data-val="10">¥10以下</div>
      <div class="filter-chip" onclick="setFilter(this,'price_max','20')" data-val="20">¥10-20</div>
      <div class="filter-chip" onclick="setFilter(this,'price_max','40')" data-val="40">¥20-40</div>
      <div class="filter-chip" onclick="setFilter(this,'price_max','100')" data-val="100">¥40+</div>
    </div>
    <div class="filter-row">
      <span class="filter-label">场景</span>
      <div class="filter-chip" onclick="toggleTag(this,'宵夜')">🌙 宵夜</div>
      <div class="filter-chip" onclick="toggleTag(this,'学生优惠')">🎓 学生优惠</div>
      <div class="filter-chip" onclick="toggleTag(this,'约饭')">👫 约饭</div>
      <div class="filter-chip" onclick="toggleTag(this,'健康')">🥗 健康</div>
    </div>
  </div>

  <div class="toolbar">
    <span class="result-count">共找到 <strong id="resultCount">—</strong> 家餐厅</span>
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:12px;color:var(--muted)">排序</span>
      <select class="sort-select" id="sortSelect" onchange="loadRestaurants()">
        <option value="recommend">综合推荐</option>
        <option value="rating">评分最高</option>
        <option value="distance">距离最近</option>
        <option value="price">价格最低</option>
      </select>
    </div>
  </div>

  <div class="restaurant-grid" id="grid">
    <div class="loading">加载中…</div>
  </div>

  <div class="pagination" id="pagination"></div>
</div>

<!-- 餐厅详情 Modal -->
<div class="modal-overlay" id="detailModal" onclick="closeModalCheck(event)">
  <div class="modal" id="detailModalInner">
    <div class="modal-hero" id="modalHero">
      <span id="modalEmoji" style="font-size:80px">🍽️</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-name" id="modalName"></div>
      <div class="modal-meta">
        <span class="modal-rating" id="modalRating"></span>
        <span style="color:var(--muted);font-size:13px" id="modalPrice"></span>
        <span style="color:var(--muted);font-size:13px" id="modalAddress"></span>
      </div>
      <div class="modal-section" id="modalTags"></div>
      <div class="modal-section">
        <div class="modal-section-title">餐厅介绍</div>
        <div class="modal-desc" id="modalDesc"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">推荐菜品</div>
        <div id="modalMenu"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">学生评价</div>
        <div id="modalReviews"></div>
        <div id="loginHint" style="padding:12px;background:var(--tag-bg);border-radius:10px;font-size:12px;color:var(--muted);margin-top:12px;text-align:center">登录后可以发表评价哦～</div>
        <form id="reviewForm" style="margin-top:12px;display:none" onsubmit="submitReview(event)">
          <input type="hidden" id="reviewRid">
          <div class="star-rate" id="starRate">
            <span class="star" data-score="1">★</span>
            <span class="star" data-score="2">★</span>
            <span class="star" data-score="3">★</span>
            <span class="star" data-score="4">★</span>
            <span class="star" data-score="5">★</span>
          </div>
          <textarea class="review-input" id="reviewText" placeholder="分享你的用餐体验…" required></textarea>
          <button type="submit" class="btn-primary" style="width:100%;height:44px;margin-top:10px">提交评价</button>
        </form>
      </div>
      <div class="modal-actions">
        <button class="modal-btn" id="favBtn" onclick="toggleFavorite()">❤️ 收藏</button>
        <button class="modal-btn" onclick="nav2Map()">🗺️ 地图导航</button>
        <button class="modal-btn primary" onclick="nav2Search()">📞 搜索下单</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
// ── 工具 ────────────────────────────────────────
function _tags(arr) {
  if (Array.isArray(arr)) return arr;
  if (typeof arr === "string" && arr.length > 0) return arr.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
  return [];
}

// ── 状态 ────────────────────────────────────────
var STATE = { campus: "", page: 1, per: 8, search: "", sort: "recommend" };
var FILTERS = { cuisine: "", price_max: "", tags: [] };
var MOOD = "";
var FAVS = JSON.parse(localStorage.getItem("favs") || "[]");
var CURRENT_LIST = [];
var TOTAL = 0;

// ── 初始化 ────────────────────────────────────────
document.addEventListener("DOMContentLoaded", function () {
  // 用户状态
  var user = Auth.getUser();
  if (Auth.isLoggedIn() && user) {
    document.getElementById("userArea").innerHTML = "👋 " + user.username;
    document.getElementById("loginBtn").style.display = "none";
    document.getElementById("logoutBtn").style.display = "";
  }

  // 校区切换
  document.getElementById("campusBtns").addEventListener("click", function (e) {
    if (e.target.classList.contains("campus-btn")) {
      document.querySelectorAll("#campusBtns .campus-btn").forEach(function (b) { b.classList.remove("active"); });
      e.target.classList.add("active");
      STATE.campus = e.target.getAttribute("data-campus") || "";
      STATE.page = 1;
      loadRestaurants();
    }
  });

  // 初始加载
  loadRestaurants();
  loadDeals();
  initStars();
});

// ── 筛选 ────────────────────────────────────────
function setFilter(el, key, val) {
  var siblings = el.parentElement.querySelectorAll(".filter-chip");
  siblings.forEach(function (b) { b.classList.remove("active"); });
  el.classList.add("active");
  FILTERS[key] = val;
  STATE.page = 1;
  loadRestaurants();
}
function toggleTag(el, tag) {
  el.classList.toggle("active");
  var idx = FILTERS.tags.indexOf(tag);
  if (idx > -1) FILTERS.tags.splice(idx, 1); else FILTERS.tags.push(tag);
  STATE.page = 1;
  loadRestaurants();
}
function moodFilter(mood) {
  MOOD = (MOOD === mood) ? "" : mood;
  var tags = document.querySelectorAll(".mood-tag");
  tags.forEach(function (t) { if ((t.textContent || "").indexOf(mood) > -1) t.classList.toggle("active", !!MOOD && (t.textContent || "").indexOf(mood) > -1); });
  STATE.page = 1;
  loadRestaurants();
}
function doSearch() {
  STATE.search = document.getElementById("searchInput").value.trim();
  STATE.page = 1;
  loadRestaurants();
}

// ── 加载餐厅 ────────────────────────────────────────
async function loadRestaurants() {
  var grid = document.getElementById("grid");
  grid.innerHTML = '<div class="loading">正在寻找餐厅…</div>';
  try {
    var data = await restaurants.list({
      campus: STATE.campus,
      search: STATE.search,
      cuisine: FILTERS.cuisine,
      price_max: FILTERS.price_max,
      tags: FILTERS.tags.join(","),
      mood: MOOD,
      sort: STATE.sort,
      page: STATE.page, per: STATE.per
    });
    CURRENT_LIST = data.items || [];
    TOTAL = data.total || 0;
    document.getElementById("resultCount").textContent = String(TOTAL);
    document.getElementById("totalStat").innerHTML = String(Math.min(999, TOTAL)) + "<span>家</span>";

    if (CURRENT_LIST.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-emoji">🍽️</div><div class="empty-title">没有找到匹配的餐厅</div><div class="empty-desc">换个关键词或筛选条件试试？</div></div>';
      document.getElementById("pagination").innerHTML = "";
      return;
    }
    renderCards(CURRENT_LIST);
    renderPagination();
    window.scrollTo({ top: 200, behavior: "smooth" });
  } catch (e) {
    grid.innerHTML = '<div class="loading">加载失败，请刷新重试</div>';
  }
}

// ── 渲染卡片 ────────────────────────────────────────
function renderCards(list) {
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  list.forEach(function (r, i) {
    var card = document.createElement("div");
    card.className = "card" + (STATE.page === 1 && i === 0 ? " featured" : "");
    var emoji = r.emoji || "🍽️";
    var rating = (r.avg_rating ? "★ " + r.avg_rating.toFixed(1) : "");
    var dist = (r.distance_km ? "· " + r.distance_km.toFixed(1) + " km" : "");
    var price = "¥" + (r.price_min || 0) + "-" + (r.price_max || 0) + "/人";
    var tags_html = "";
    _tags(r.tags).slice(0, 4).forEach(function (t) { tags_html += '<span class="card-tag">' + t + '</span>'; });
    var colors = ["#ffe8cc","#ffeccc","#e8f5e9","#e3f2fd","#fce4ec"];
    var color = colors[(r.id || 0) % colors.length];
    var is_fav = FAVS.indexOf(r.id) > -1;

    card.innerHTML =
      '<div class="card-thumb">' +
        '<div class="card-thumb-bg" style="background:' + color + '">' +
          '<div class="deco deco1" style="background:' + color + ';filter:brightness(.9)"></div>' +
          '<div class="deco deco2" style="background:' + color + ';filter:brightness(.9)"></div>' +
          '<div class="card-thumb-emoji">' + emoji + '</div>' +
        '</div>' +
        '<div class="card-thumb-overlay"></div>' +
        '<button class="card-fav ' + (is_fav ? "liked" : "") + '" onclick="event.stopPropagation();toggleFavById(' + r.id + ',this)">' + (is_fav ? "❤️" : "🤍") + '</button>' +
        (STATE.page === 1 && i === 0 ? '<div class="card-badge badge-hot">🔥 HOT</div>' : "") +
      '</div>' +
      '<div class="card-body">' +
        '<div class="card-header"><div class="card-name">' + r.name + '</div><div class="card-rating">' + rating + '</div></div>' +
        '<div class="card-meta"><span>' + (r.cuisine || "美食") + '</span><span>' + (r.address || "") + '</span></div>' +
        '<div class="card-tags">' + tags_html + '</div>' +
        '<div class="card-footer"><span class="price-range">' + price + '</span><span class="card-distance">' + dist + '</span></div>' +
      '</div>';
    card.onclick = function () { showDetail(r.id); };
    grid.appendChild(card);
  });
}

// ── 分页 ────────────────────────────────────────
function renderPagination() {
  var pages = Math.ceil(TOTAL / STATE.per);
  if (pages <= 1) { document.getElementById("pagination").innerHTML = ""; return; }
  var html = "";
  if (STATE.page > 1) html += '<div class="page-btn" onclick="gotoPage(' + (STATE.page - 1) + ')">‹</div>';
  for (var i = 1; i <= Math.min(pages, 5); i++) {
    html += '<div class="page-btn ' + (STATE.page === i ? "active" : "") + '" onclick="gotoPage(' + i + ')">' + i + '</div>';
  }
  if (STATE.page < pages) html += '<div class="page-btn" onclick="gotoPage(' + (STATE.page + 1) + ')">›</div>';
  document.getElementById("pagination").innerHTML = html;
}
function gotoPage(p) { STATE.page = p; loadRestaurants(); window.scrollTo({ top: 0, behavior: "smooth" }); }

// ── 加载优惠 ────────────────────────────────────────
async function loadDeals() {
  if (typeof deals === "undefined" || !deals || !deals.list) return;
  try {
    var d = await deals.list();
    if (d && d.items && d.items.length) {
      document.getElementById("dealsSection").style.display = "";
      var html = "";
      d.items.forEach(function (x) {
        html += '<div class="deal-card" onclick="showDetail(' + x.restaurant_id + ')">' +
          '<div class="deal-emoji">' + (x.emoji || "🎟️") + '</div>' +
          '<div class="deal-name">' + x.title + '</div>' +
          '<div class="deal-desc">' + (x.desc || "") + '</div>' +
          '<div class="deal-price"><span class="deal-new">¥' + (x.price || 0) + '</span></div>' +
        '</div>';
      });
      document.getElementById("dealsScroll").innerHTML = html;
    }
  } catch (e) {}
}

// ── 餐厅详情 ────────────────────────────────────────
var CURRENT_R = null;
async function showDetail(id) {
  try {
    CURRENT_R = await restaurants.detail(id);
  } catch (e) { return; }
  document.getElementById("modalName").textContent = CURRENT_R.name;
  document.getElementById("modalEmoji").textContent = CURRENT_R.emoji || "🍽️";
  document.getElementById("modalHero").style.background =
    "linear-gradient(135deg," + ["#ffe8cc","#ffeccc","#e8f5e9","#e3f2fd","#fce4ec"][(CURRENT_R.id||0) % 5] + ",#fff3e5)";
  document.getElementById("modalRating").textContent = CURRENT_R.avg_rating ? "★ " + CURRENT_R.avg_rating.toFixed(1) : "★ —";
  document.getElementById("modalPrice").textContent = "¥" + (CURRENT_R.price_min||0) + "-" + (CURRENT_R.price_max||0) + "/人";
  document.getElementById("modalAddress").textContent = "📍 " + (CURRENT_R.address || "大学城");
  var tags_html = "";
  _tags(CURRENT_R.tags).forEach(function (t) { tags_html += '<span class="card-tag" style="margin-right:6px;font-size:12px;padding:4px 12px">' + t + '</span>'; });
  document.getElementById("modalTags").innerHTML = tags_html;
  document.getElementById("modalDesc").textContent = CURRENT_R.description || "大学城同学推荐的好餐厅～";
  var menu = CURRENT_R.menu_items || (CURRENT_R.menu ? JSON.parse(CURRENT_R.menu) : []);
  var menu_html = "";
  if (Array.isArray(menu) && menu.length > 0) {
    menu.forEach(function (m) {
      menu_html += '<div class="menu-item"><div class="menu-item-left"><span style="font-size:20px">' + (m.emoji||"🍽️") + '</span><span>' + (m.name || "") + '</span></div><div class="menu-item-price">¥' + (m.price || 0) + '</div></div>';
    });
  } else {
    menu_html = '<div class="menu-item"><div class="menu-item-left"><span>🎓 招牌菜 · 学生党最爱</span></div><div class="menu-item-price">¥' + Math.round(((CURRENT_R.price_min||15)+(CURRENT_R.price_max||30))/2) + '</div></div>' +
      '<div class="menu-item"><div class="menu-item-left"><span>👫 双人套餐 · 性价比之选</span></div><div class="menu-item-price">¥' + ((CURRENT_R.price_max||30) * 2) + '</div></div>';
  }
  document.getElementById("modalMenu").innerHTML = menu_html;
  document.getElementById("modalReviews").innerHTML = '<div style="font-size:12px;color:var(--muted);font-family:\'DM Mono\',monospace">共 ' + (CURRENT_R.review_count || 0) + ' 条评价</div>';
  document.getElementById("reviewRid").value = String(CURRENT_R.id);
  var is_fav = FAVS.indexOf(CURRENT_R.id) > -1;
  var favBtn = document.getElementById("favBtn");
  favBtn.textContent = is_fav ? "❤️ 已收藏" : "🤍 收藏";

  document.getElementById("loginHint").style.display = Auth.isLoggedIn() ? "none" : "";
  document.getElementById("reviewForm").style.display = Auth.isLoggedIn() ? "" : "none";

  document.getElementById("detailModal").classList.add("open");
}
function closeModal() { document.getElementById("detailModal").classList.remove("open"); }
function closeModalCheck(e) { if (e.target.id === "detailModal") closeModal(); }

// ── 收藏 ────────────────────────────────────────
function toggleFavById(id, btn) {
  var idx = FAVS.indexOf(id);
  if (idx > -1) { FAVS.splice(idx, 1); btn.classList.remove("liked"); btn.textContent = "🤍"; }
  else { FAVS.push(id); btn.classList.add("liked"); btn.textContent = "❤️"; }
  localStorage.setItem("favs", JSON.stringify(FAVS));
}
function toggleFavorite() {
  if (!CURRENT_R) return;
  toggleFavById(CURRENT_R.id, document.getElementById("favBtn"));
}

// ── 评价 ────────────────────────────────────────
var STAR_SCORE = 0;
function initStars() {
  var stars = document.querySelectorAll("#starRate .star");
  stars.forEach(function (s) {
    s.addEventListener("click", function () {
      STAR_SCORE = parseInt(s.getAttribute("data-score"), 10);
      stars.forEach(function (x) { x.classList.toggle("on", parseInt(x.getAttribute("data-score"), 10) <= STAR_SCORE); });
    });
  });
}
async function submitReview(e) {
  e.preventDefault();
  if (!STAR_SCORE) { alert("请先选择评分⭐"); return; }
  var text = document.getElementById("reviewText").value.trim();
  if (!text) return;
  var rid = parseInt(document.getElementById("reviewRid").value, 10);
  try {
    await reviews.create({ restaurant_id: rid, rating: STAR_SCORE, content: text });
    document.getElementById("reviewText").value = "";
    STAR_SCORE = 0;
    document.querySelectorAll("#starRate .star").forEach(function (x) { x.classList.remove("on"); });
    alert("评价成功！感谢分享～");
  } catch (e) { alert("提交失败，请稍后再试"); }
}

// ── 导航 ────────────────────────────────────────
function nav2Map() {
  if (!CURRENT_R) return;
  window.open("https://uri.amap.com/marker?position=" + (CURRENT_R.longitude||113.3508) + "," + (CURRENT_R.latitude||23.0437) + "&name=" + encodeURIComponent(CURRENT_R.name) + "&callnative=1");
}
function nav2Search() {
  if (!CURRENT_R) return;
  window.open("https://uri.amap.com/search?keyword=" + encodeURIComponent(CURRENT_R.address || CURRENT_R.name));
}
</script>
</body>
</html>
